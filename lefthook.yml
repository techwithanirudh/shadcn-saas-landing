post-merge:
  commands:
    install-deps:
      run: pnpm install

commit-msg:
  commands:
    "lint commit message":
      run: pnpm commitlint --edit {1}
pre-commit:
  jobs:
    - run: pnpm dlx ultracite fix
      glob: 
        - "*.js"
        - "*.jsx"
        - "*.ts"
        - "*.tsx"
        - "*.json"
        - "*.jsonc"
        - "*.css"
      stage_fixed: true
